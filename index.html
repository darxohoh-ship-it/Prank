<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>System Breach</title>
<style>
body { 
    background: #000; color: #0f0; font-family: monospace; text-align: center; 
    padding-top: 40%; margin: 0; overflow: hidden; 
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none;
}
h2 { font-size: 24px; animation: blink 1s infinite; }
@keyframes blink { 50% { opacity: 0; } }
.bar { width: 80%; height: 20px; background: #333; margin: 20px auto; border-radius: 10px; }
.fill { width: 0%; height: 100%; background: #f00; border-radius: 10px; animation: load 3s forwards; }
@keyframes load { 100% { width: 100%; } }
#scare { 
    display: none; position: fixed; top:0; left:0; width:100vw; height:100vh; 
    background: #000; z-index: 9999; overflow: hidden;
}
#scare img { 
    width: 100%; height: 100%; object-fit: cover; 
    animation: shake 0.05s infinite; 
}
@keyframes shake {
  0% { transform: translate(5px, 5px) rotate(0deg); }
  25% { transform: translate(-5px, -5px) rotate(2deg); }
  50% { transform: translate(-5px, 5px) rotate(0deg); }
  75% { transform: translate(5px, -5px) rotate(-2deg); }
  100% { transform: translate(5px, 5px) rotate(0deg); }
}
</style>
</head>
<body>

<div id="main">
  <h2>جاري اختراق الجهاز...</h2>
  <div class="bar"><div class="fill"></div></div>
  <p>يرجى عدم إغلاق الشاشة.</p>
</div>

<div id="scare">
  <img src="https://i.ibb.co/6PZ4Z9B/scary.jpg">
</div>

<script>
// تعطيل زر الرجوع
history.pushState(null, null, location.href);
window.onpopstate = function () { history.go(1); };

// طلب ملء الشاشة عشان يختفي شريط المتصفح
function goFullScreen() {
    let elem = document.documentElement;
    if (elem.requestFullscreen) { elem.requestFullscreen().catch(e => {}); }
    else if (elem.webkitRequestFullscreen) { elem.webkitRequestFullscreen(); }
}
document.body.addEventListener('click', goFullScreen, { once: true });
document.body.addEventListener('touchstart', goFullScreen, { once: true });

setTimeout(() => {
  document.getElementById('main').style.display = 'none';
  document.getElementById('scare').style.display = 'block';
  
  // تشغيل الصوت
  let a = new Audio('https://www.myinstants.com/media/sounds/screaming-sheep.mp3');
  a.loop = true;
  a.volume = 1.0; // أقصى صوت
  a.play().catch(e => console.log("المتصفح منع الصوت التلقائي"));

  // اهتزاز الجوال
  if(navigator.vibrate) {
      setInterval(() => { navigator.vibrate([1000, 500, 1000, 500]); }, 2000);
  }
}, 3000);
</script>

</body>
</html>
