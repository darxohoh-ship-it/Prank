<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { background: #000; color: #0f0; font-family: sans-serif; text-align: center; padding-top: 50%; margin: 0; overflow: hidden;}
h2 { font-size: 24px; }
.bar { width: 80%; height: 20px; background: #333; margin: 20px auto; border-radius: 10px; }
.fill { width: 0%; height: 100%; background: #0f0; border-radius: 10px; animation: load 4s forwards; }
@keyframes load { 100% { width: 100%; } }
#scare { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: #000; z-index: 999;}
#scare img { width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
<div id="main">
  <h2>جاري تحديث النظام...</h2>
  <div class="bar"><div class="fill"></div></div>
</div>
<div id="scare">
  <img src="https://i.ibb.co/6PZ4Z9B/scary.jpg">
</div>
<script>
setTimeout(() => {
  document.getElementById('main').style.display = 'none';
  document.getElementById('scare').style.display = 'block';
  let a = new Audio('https://www.myinstants.com/media/sounds/screaming-sheep.mp3');
  a.play();
  if(navigator.vibrate) navigator.vibrate([500, 200, 500, 200, 1000]);
}, 4000);
</script>
</body>
</html>
